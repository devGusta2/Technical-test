name: Ci tecnicaltest ${{github.event.repository.name}}
on:
  push:
    branches: [main, develop, ci/github-actions-pipeline]

  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set  JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw clean test
