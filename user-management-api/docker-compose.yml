services:
  postgres:
    image: postgres:16-alpine
    container_name: teste-tecnico-pst
    restart: unless-stopped
    environment:
      POSTGRES_DB: teste_tecnico
      POSTGRES_PASSWORD: dellavolpe
      POSTGRES_USER: dellavolpe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: user-management-api
    restart: unless-stopped
    environment:
      JWT_PRIVATE_KEY_PATH: /app/secrets/private.key
    volumes:
      - C:/Users/gugui/secrets/private.key:/app/secrets/private.key:ro
      - .:/app
      - maven_cache:/root/.m2
    depends_on:
      - postgres
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  maven_cache:
